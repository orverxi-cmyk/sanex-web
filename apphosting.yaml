    value: smtp.gmail.com
  - variable: SMTP_PORT
    value: "587"
  - variable: SMTP_USER
    value: sanexcompany@gmail.com
  - variable: EMAIL_FROM
    value: '"SANEX Company Ltd" <sanexcompany@gmail.com>'
  - variable: COMPANY_EMAIL
    value: sanexcompany@gmail.com
  - variable: MASTER_ADMIN_EMAIL
    value: orverxi@gmail.com
  - variable: SMTP_CLIENT_ID
    value: 1049365258999-eopv3fgo0nahhr5ra1ln2tdjqedosefg.apps.googleusercontent.com
  - variable: SMTP_CLIENT_SECRET
    secret: SMTP_CLIENT_SECRET
  - variable: SMTP_REFRESH_TOKEN
    secret: SMTP_REFRESH_TOKEN
